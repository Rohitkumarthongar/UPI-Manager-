name: Release Android App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create default .env file for CI
        run: |
          cp .env.example .env

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required secret $name is missing"
              exit 1
            fi
          done
          python3 - <<'PY'
          import base64, os, pathlib
          try:
              data = base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True)
              if not data:
                  raise ValueError('empty keystore')
              pathlib.Path('release-upload.jks').write_bytes(data)
          except ValueError as exc:
              raise SystemExit(f'Invalid release keystore: {exc}')
          PY
          chmod 600 release-upload.jks
          echo "KEYSTORE_PATH=$PWD/release-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          code=$(( $(date -u +%s) - 1577836800 ))
          if (( code < 3 || code > 2100000000 )); then
            echo '::error::Generated versionCode is outside Android range'
            exit 1
          fi
          ./gradlew assembleRelease -PreleaseVersionCode="$code" -PreleaseVersionName="1.0.$code" --stacktrace

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
