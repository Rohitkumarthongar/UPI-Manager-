name: Build and Deploy to Firebase

on:
  push:
    branches: [ main, master ] # Triggers when you push to main/master

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android Release APK
      run: ./gradlew assembleRelease

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        file: app/build/outputs/apk/release/app-release-unsigned.apk # Adjust path if signed
        testers: rohitkumarsoni713@gmail.com
