# Builds a signed APK and publishes it as a GitHub release. The app checks the latest release and offers it as an
# update (automatic pop-up on launch, and Reports → App Settings → Check for updates).
#
# Runs when app code is pushed to main, or when started from the Actions tab (optionally with release notes).
#
# One-time setup (repository Settings → Secrets and variables → Actions → Secrets):
#   UPI_KEYSTORE_BASE64   base64 of the release keystore:  base64 -w0 upi-manager-release.jks
#   STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   from keystore.properties
# Keep the .jks safe: every update must be signed with the same key, or Android refuses to install it.
name: Release Android app

on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      notes:
        description: What changed (shown in the update pop-up)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.UPI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the UPI_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets (see the top of this file)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        # Local builds are versionCode 1, so every published release is newer than any build already installed.
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          KS: ${{ secrets.UPI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionCode="${{ steps.v.outputs.code }}" \
            -PappVersionName="${{ steps.v.outputs.name }}" \
            -PupdateRepo="${{ github.repository }}"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.v.outputs.code }}
          NAME: ${{ steps.v.outputs.name }}
          NOTES: ${{ github.event.inputs.notes || github.event.head_commit.message }}
        run: |
          apk="upi-manager-$NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          summary=$(printf '%s' "$NOTES" | head -n 1)
          # The app reads the hidden line to compare versions and verify the download.
          printf '%s\n\n<!-- upi-manager:versionCode=%s sha256=%s -->\n' "${summary:-Improvements and fixes.}" "$CODE" "$sha" > notes.md
          gh release create "v$NAME" "$apk" --title "UPI Manager $NAME" --notes-file notes.md --latest
