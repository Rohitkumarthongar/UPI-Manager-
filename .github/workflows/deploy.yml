name: Build and Deploy to Firebase

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# A single Hosting target is shared by both branches and manual runs.
concurrency:
  group: firebase-hosting-android-update
  cancel-in-progress: true

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check required publishing secrets
        env:
          CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in CREDENTIAL_FILE_CONTENT RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing required GitHub Actions repository secrets: ${missing[*]}. Add them under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Preflight public release destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Public assets must be downloadable without credentials in the Android app.
          repo=$(gh api "repos/$RELEASE_REPOSITORY" --jq '[.full_name, .private] | @tsv') || {
            echo '::error::Cannot access release repository with the built-in GITHUB_TOKEN'
            exit 1
          }
          IFS=$'\t' read -r full_name private <<< "$repo"
          if [[ "$full_name" != "$RELEASE_REPOSITORY" || "$private" != false ]]; then
            echo '::error::Release destination must be the current public repository'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare signing and service account
        env:
          CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib

          def decode(value):
              return base64.b64decode(value, validate=True)

          try:
              keystore = decode(os.environ['RELEASE_KEYSTORE_BASE64'])
              if not keystore:
                  raise ValueError('empty keystore')
              pathlib.Path('release-upload.jks').write_bytes(keystore)
              value = os.environ['CREDENTIAL_FILE_CONTENT'].strip()
              try:
                  account = json.loads(value)
              except json.JSONDecodeError:
                  account = json.loads(decode(value))
              if account.get('type') != 'service_account':
                  raise ValueError('credential must be a service account JSON')
              pathlib.Path('service_account.json').write_text(json.dumps(account))
          except (ValueError, KeyError, UnicodeDecodeError) as exc:
              raise SystemExit(f'Invalid signing keystore or service-account credential: {exc}')
          PY
          chmod 600 release-upload.jks service_account.json
          echo "KEYSTORE_PATH=$PWD/release-upload.jks" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/service_account.json" >> "$GITHUB_ENV"
          # Pass signing values as environment variables, never as command-line arguments.

      - name: Compute build version
        run: |
          # Seconds since 2020-01-01: higher than the old static code 2 and within Android's limit until 2086.
          code=$(( $(date -u +%s) - 1577836800 ))
          if (( code < 3 || code > 2100000000 )); then
            echo '::error::Generated versionCode is outside Android range'
            exit 1
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$code" >> "$GITHUB_ENV"

      - name: Create default .env file for CI
        run: cp .env.example .env

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PreleaseVersionCode="$VERSION_CODE" -PreleaseVersionName="$VERSION_NAME" --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Reject older or duplicate remote versions before publishing
        run: |
          remote=$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 -H 'Cache-Control: no-cache' \
            'https://upi-manager-b2087.web.app/version.json' | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["latestVersionCode"]))') || {
              echo '::error::Cannot check current Hosting version; refusing to publish blindly'
              exit 1
            }
          if (( VERSION_CODE <= remote )); then
            echo "::error::Build version $VERSION_CODE is not newer than Hosting version $remote"
            exit 1
          fi

      - name: Publish signed APK to public release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk" || { echo '::error::Signed release APK missing'; exit 1; }
          tag="build-$VERSION_CODE"
          # A reused tag could point at different bytes. Never overwrite a release
          # or adopt an existing tag on rerun, including after a partial upload.
          if gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null ||
             gh api "repos/$RELEASE_REPOSITORY/releases/tags/$tag" --silent 2>/dev/null; then
            echo "::error::Tag or release $tag already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create "$tag" "$apk#app-release.apk" \
            --repo "$RELEASE_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
            --notes "Signed Android release $VERSION_NAME (versionCode $VERSION_CODE)."

      - name: Verify anonymous public APK download
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tag="build-$VERSION_CODE"
          url="https://github.com/$RELEASE_REPOSITORY/releases/download/$tag/app-release.apk"
          downloaded=$(mktemp)
          trap 'rm -f "$downloaded"' EXIT
          # No Authorization header or GitHub token: this must work for every user.
          effective=$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 \
            --output "$downloaded" --write-out '%{url_effective}' "$url") || {
              echo '::error::Public APK URL is not anonymously downloadable'
              exit 1
            }
          if [[ "$effective" != https://* ]]; then
            echo '::error::APK download did not finish over HTTPS'
            exit 1
          fi
          expected_size=$(stat -c '%s' "$apk")
          actual_size=$(stat -c '%s' "$downloaded")
          expected_hash=$(sha256sum "$apk")
          actual_hash=$(sha256sum "$downloaded")
          if [[ "$expected_size" != "$actual_size" || "${expected_hash%% *}" != "${actual_hash%% *}" ]]; then
            echo '::error::Public APK differs from the signed build (size or SHA-256)'
            exit 1
          fi

      - name: Recheck remote version and stage metadata only
        run: |
          remote=$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 -H 'Cache-Control: no-cache' \
            'https://upi-manager-b2087.web.app/version.json' | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["latestVersionCode"]))') || {
              echo '::error::Cannot check current Hosting version; refusing to publish blindly'
              exit 1
            }
          if (( VERSION_CODE <= remote )); then
            echo "::error::Build version $VERSION_CODE is not newer than Hosting version $remote"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib
          manifest = {
              'latestVersionCode': int(os.environ['VERSION_CODE']),
              'latestVersionName': os.environ['VERSION_NAME'],
              'apkDownloadUrl': ('https://github.com/' + os.environ['RELEASE_REPOSITORY'] +
                                 '/releases/download/build-' + os.environ['VERSION_CODE'] + '/app-release.apk'),
              'isMandatory': False,
              'releaseNotes': 'Latest signed release build.'
          }
          pathlib.Path('public/version.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Refuse executable files in Hosting payload
        run: |
          python3 - <<'PY'
          import pathlib

          root = pathlib.Path('public')
          forbidden = {'.apk', '.aab', '.dex', '.jar', '.class', '.so', '.exe', '.dll', '.dylib'}
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit(f'Hosting payload contains a symlink: {path}')
              if not path.is_file():
                  continue
              if path.suffix.lower() in forbidden:
                  raise SystemExit(f'Hosting payload contains an executable artifact: {path}')
              with path.open('rb') as file:
                  magic = file.read(8)
              if (magic.startswith((b'\x7fELF', b'MZ', b'dex\n', b'\xca\xfe\xba\xbe')) or
                      magic[:4] in (b'\xfe\xed\xfa\xce', b'\xce\xfa\xed\xfe',
                                    b'\xfe\xed\xfa\xcf', b'\xcf\xfa\xed\xfe')):
                  raise SystemExit(f'Hosting payload contains executable bytes: {path}')
          PY

      - name: Deploy metadata and static assets to Firebase Hosting
        run: firebase deploy --only hosting --project upi-manager-b2087 --non-interactive

      - name: Distribute signed release to testers
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_TESTERS != '' }}
        run: firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk --app "$FIREBASE_APP_ID" --testers "$FIREBASE_TESTERS" --project upi-manager-b2087
