# Builds a signed APK and publishes it as a GitHub release. The app checks the latest release and offers it as an
# update (automatic pop-up on launch, and Reports → App Settings → Check for updates).
#
# Runs when app code is pushed to main, or when started from the Actions tab (optionally with release notes).
#
# One-time setup (repository Settings → Secrets and variables → Actions → Secrets):
#   UPI_KEYSTORE_BASE64   base64 of the release keystore:  base64 -w0 upi-manager-release.jks
#   STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   from keystore.properties
# Keep the .jks safe: every update must be signed with the same key, or Android refuses to install it.
name: Release Android app

on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      notes:
        description: What changed (shown in the update pop-up)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.UPI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing required GitHub Actions repository secrets: ${missing[*]}. Add them under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          try:
              data = base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True)
              if not data:
                  raise ValueError('empty keystore')
              pathlib.Path('release-upload.jks').write_bytes(data)
          except ValueError as exc:
              raise SystemExit(f'Invalid release keystore: {exc}')
          PY
          chmod 600 release-upload.jks
          echo "KEYSTORE_PATH=$PWD/release-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          code=$(( $(date -u +%s) - 1577836800 ))
          if (( code < 3 || code > 2100000000 )); then
            echo '::error::Generated versionCode is outside Android range'
            exit 1
          fi
          ./gradlew assembleRelease -PreleaseVersionCode="$code" -PreleaseVersionName="1.0.$code" --stacktrace

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
