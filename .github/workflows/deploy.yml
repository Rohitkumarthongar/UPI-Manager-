name: Build and Deploy to Firebase

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create default .env file for CI
      run: |
        cp .env.example .env

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Setup Firebase Service Account Credentials
      run: |
        python3 -c '
        import os, base64, json
        content = os.environ.get("SECRET_CONTENT", "").strip()
        try:
            decoded = base64.b64decode(content).decode("utf-8")
            json.loads(decoded)
            data = decoded
        except Exception:
            data = content
        with open("service_account.json", "w") as f:
            f.write(data)
        '
        echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service_account.json" >> $GITHUB_ENV
      env:
        SECRET_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Deploy to Firebase App Distribution
      run: |
        firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
          --app "${{ secrets.FIREBASE_APP_ID }}" \
          --testers "rohitkumarsoni713@gmail.com"
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service_account.json
